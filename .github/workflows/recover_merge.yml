name: Recover and publish a finished run

# Use this when all workers of a scraper run finished but the "Merge and publish" job failed
# (for example the secret scan stopped it). It takes the plan and the worker results that the
# failed run already saved and publishes them with the current batches.py. No scraping.
# The worker results are kept for 14 days and the plan for 7 days.

run-name: Recover ${{ inputs.group }} from run ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      group:
        description: Which group the failed run was for
        required: true
        type: choice
        options:
          - p1
          - p2_p3
          - p4_p5
      run_id:
        description: Run ID of the failed run (the long number at the end of its web address)
        required: true
        type: string

concurrency:
  group: document-monitor-${{ inputs.group == 'p4_p5' && 'p4-p5' || 'production' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  recover:
    name: Publish ${{ inputs.group }} from run ${{ inputs.run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GROUP: ${{ inputs.group }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the run ID
        shell: bash
        run: |
          if ! echo "$SOURCE_RUN_ID" | grep -Eq '^[0-9]{6,}$'; then
            echo "::error::Run ID must be only the long number from the run's web address"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.group }}-batch-plan
          path: batch_plan
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.group }}-worker-*
          path: worker_outputs
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Merge the saved chunks into the production files
        run: python batches.py merge --group "$GROUP" --root worker_outputs
      - name: Find rows containing Alibaba secret-like patterns
        run: python batches.py scan --group "$GROUP"
      - name: Commit the production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          PATHS=$(python batches.py paths --group "$GROUP")
          git add -A -f -- $PATHS
          for f in $(git diff --cached --name-only); do
            if [ -f "$f" ] && [ "$(stat -c%s "$f")" -gt 95000000 ]; then
              echo "::error::$f is over 95 MB and cannot be pushed to GitHub"
              exit 1
            fi
          done
          git commit -m "Update scraped data ($GROUP) - recovered from run $SOURCE_RUN_ID" || echo "No changes to commit"
          pushed=false
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && { pushed=true; break; }
            echo "Push/rebase failed. Retry attempt $i..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          "$pushed" || { echo "Failed to publish results after three attempts"; exit 1; }
