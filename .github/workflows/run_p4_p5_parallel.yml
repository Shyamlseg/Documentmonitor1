name: Run Scraper P4 P5 Parallel

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode: seed or full"
        required: true
        default: "full"
      workers:
        description: Parallel workers (1-20)
        required: true
        default: "15"
      chunk_size:
        description: Links per chunk
        required: true
        default: "25"

concurrency:
  group: document-monitor-p4-p5
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  p4_p5:
    uses: ./.github/workflows/scraper_queue.yml
    with:
      group: p4_p5
      run_mode: ${{ inputs.run_mode }}
      workers: ${{ inputs.workers }}
      chunk_size: ${{ inputs.chunk_size }}
