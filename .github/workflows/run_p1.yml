name: Run Scraper P1

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode: full or seed"
        required: true
        default: "full"
      workers:
        description: Parallel workers (1-20)
        required: true
        default: "15"
      chunk_size:
        description: Links per chunk
        required: true
        default: "25"

concurrency:
  group: document-monitor-production
  cancel-in-progress: false

# contents: write is needed for the queue claim branches and for committing the results.
permissions:
  contents: write

jobs:
  p1:
    uses: ./.github/workflows/scraper_queue.yml
    with:
      group: p1
      run_mode: ${{ inputs.run_mode || 'full' }}
      workers: ${{ inputs.workers || '15' }}
      chunk_size: ${{ inputs.chunk_size || '25' }}
